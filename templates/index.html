<!DOCTYPE html>
<html lang="ar">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Support Chat</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
display:flex;
height:100vh;
background:#f5f5f5;
direction:rtl;
overflow:hidden;
}

/* SIDEBAR */

.sidebar{

width:300px;
background:#202123;
color:white;

padding:15px;

display:flex;
flex-direction:column;

overflow-y:auto;

}

.logo{

font-size:28px;
font-weight:bold;

text-align:center;

margin-bottom:20px;

}

.btn{

width:100%;

padding:12px;

border:none;

border-radius:10px;

margin-bottom:10px;

font-size:16px;

cursor:pointer;

}

.new-chat{

background:#19c37d;
color:white;

}

.clear-history{

background:#e53935;
color:white;

}

.chat-item{

background:#343541;

padding:12px;

border-radius:10px;

margin-bottom:10px;

position:relative;

cursor:pointer;

}

.delete-one{

position:absolute;

left:10px;
top:10px;

cursor:pointer;

}

/* MAIN */

.main{

flex:1;

display:flex;

flex-direction:column;

height:100vh;

}

.header{

background:white;

padding:20px;

font-size:32px;

font-weight:bold;

text-align:center;

border-bottom:1px solid #ddd;

}

.chat-box{

flex:1;

overflow-y:auto;

padding:20px;

}

.message{

padding:15px;

border-radius:15px;

margin:10px 0;

max-width:75%;

line-height:1.7;

white-space:pre-wrap;

}

.user{

background:#d7f8d7;

margin-right:auto;

}

.ai{

background:white;

border:1px solid #ddd;

}

.input-area{

display:flex;

gap:10px;

padding:15px;

background:white;

border-top:1px solid #ddd;

}

textarea{

flex:1;

height:60px;

resize:none;

padding:15px;

font-size:16px;

border-radius:10px;

}

.send{

padding:15px 25px;

border:none;

background:#19c37d;

color:white;

font-size:18px;

border-radius:10px;

cursor:pointer;

}


/* MOBILE */

@media(max-width:900px){

body{

flex-direction:column;

}

.sidebar{

width:100%;

height:170px;

order:2;

}

.main{

order:1;

height:calc(100vh - 170px);

}

.header{

font-size:22px;

padding:15px;

}

.message{

max-width:90%;

}

}


@media(max-width:600px){

.input-area{

padding:10px;

}

.send{

width:90px;

font-size:16px;

}

textarea{

height:55px;

}

.sidebar{

height:150px;

}

.main{

height:calc(100vh - 150px);

}

}

</style>

</head>

<body>


<div class="sidebar">

<div class="logo">

AI Support

</div>


<button class="btn new-chat" onclick="newChat()">

New Chat +

</button>


<button class="btn clear-history" onclick="clearHistory()">

Clear History 🗑

</button>


<div id="history"></div>

</div>


<div class="main">


<div class="header">

AI Support Chat

</div>


<div class="chat-box" id="chatBox"></div>


<div class="input-area">

<textarea
id="message"
placeholder="Type your message here..."
></textarea>


<button class="send"
onclick="sendMessage()">

Send

</button>

</div>


</div>


<script>

/* حط الجافاسكريبت القديم بتاعك هنا بدون تغيير */

</script>


</body>

</html>
